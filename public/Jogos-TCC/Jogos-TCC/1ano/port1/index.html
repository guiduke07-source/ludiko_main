<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trem das Sílabas - jogo educativo para formar palavras">
    <title>Trem das Sílabas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="jogo">
        <header class="topo">
            <button id="homeBtn" class="botao-icone" type="button" aria-label="Voltar para a página inicial" title="Voltar para o início">
                <img src="img/home.png" alt="" aria-hidden="true">
            </button>

            <button id="somBtn" class="botao-icone" type="button" aria-label="Repetir orientação falada" title="Ouvir orientação novamente">
                <img src="img/somicone.png" alt="" aria-hidden="true">
            </button>

            <!-- Botão perfeitamente alinhado na barra de controles -->
            <button id="btn-sair-jogo" class="botao-voltar-texto" onclick="window.location.href='/Inicioreal'">
                ← Voltar ao Início
            </button>
        </header>

        <div id="vidas" class="vidas" role="status" aria-label="3 vidas restantes">
            <img src="img/vida.png" alt="" aria-hidden="true">
            <img src="img/vida.png" alt="" aria-hidden="true">
            <img src="img/vida.png" alt="" aria-hidden="true">
        </div>

        <section class="conteudo" aria-label="Jogo Trem das Sílabas">
            <div class="imagem-palavra">
                <img id="imagemPalavra" src="img/boneca.png" alt="Imagem da palavra">
            </div>

            <section class="area-trem" aria-label="Vagões para colocar as sílabas">
                <img class="imagem-trem" src="img/trem.png" alt="" aria-hidden="true">
                <div class="vagoes">
                    <button class="vagao" type="button" data-posicao="0" aria-label="Primeiro vagão vazio"></button>
                    <button class="vagao" type="button" data-posicao="1" aria-label="Segundo vagão vazio"></button>
                    <button class="vagao" type="button" data-posicao="2" aria-label="Terceiro vagão vazio"></button>
                </div>
            </section>

            <section class="area-silabas" aria-labelledby="instrucao">
                <p id="instrucao" class="instrucao">Escolha as sílabas para formar a palavra:</p>
                <div id="silabas" class="silabas" role="list" aria-label="Sílabas disponíveis"></div>
            </section>
        </section>

        <!-- Mensagem de próxima palavra -->
        <div id="mensagem" class="mensagem" role="dialog" aria-modal="true">
            <div class="caixa-mensagem">
                <h2 id="tituloMensagem">Muito bem!</h2>
                <p id="textoMensagem">Você conseguiu!</p>
                <button id="proximoBtn" type="button">Próxima palavra</button>
            </div>
        </div>

        <!-- Modal Oficial de Conclusão com Troféu -->
        <div id="modal-fim-jogo" class="modal-fim-overlay" style="display: none;">
            <div class="fim-card">
                <div class="trofeu">🏆</div>
                <h2>Parabéns!</h2>
                <p>Você completou todas as palavras do Trem das Sílabas!</p>
                <div class="fim-acoes">
                    <button onclick="jogarNovamente()" class="btn-fim-repetir">Jogar Novamente</button>
                    <button onclick="window.location.href='/Inicioreal'" class="btn-fim-sair">Voltar ao Início</button>
                </div>
            </div>
        </div>
    </main>

    <script src="port1.js"></script>
</body>
</html>
