<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo dos Balões</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <header class="topo-controles">
      <div class="botoes-esquerda">
        <button id="btn-home" class="btn-icone" aria-label="Página Inicial">
          <img src="img/home.png" alt="Início" />
        </button>
        <button id="btn-som" class="btn-icone" aria-label="Ouvir instrução">
          <img src="img/somicone.png" alt="Som" />
        </button>
      </div>

      <div class="vidas-container">
        <img src="img/vida.png" class="coracao" alt="Vida" />
        <img src="img/vida.png" class="coracao" alt="Vida" />
        <img src="img/vida.png" class="coracao" alt="Vida" />
      </div>
    </header>

    <main class="area-jogo">
      <div class="orientacao-titulo">
       Clique no balão com o número <span id="numero-alvo">12</span>
      </div>

      <div id="baloes-container" class="baloes-container"></div>
    </main>

    <div id="modal-feedback" class="modal">
      <div class="modal-conteudo">
        <h2 id="modal-titulo">Parabéns!</h2>
        <p id="modal-mensagem">Você encontrou o balão correto!</p>
        <button id="btn-reiniciar" class="btn-acao">Jogar Novamente</button>
      </div>
    </div>
  </div>

  <script src="mat3.js"></script>
</body>
</html>
